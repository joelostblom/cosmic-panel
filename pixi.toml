[workspace]
channels = ['conda-forge']
name = "cosmic-panel"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
build = "cargo build --locked --release"
try-local = { cmd = "sh scripts/local-override.sh install", depends-on = ["build"] }
restore-local = "sh scripts/local-override.sh restore"

[dependencies]
rust = ">=1.100.0,<1.101"
pkg-config = ">=0.29.2,<0.30"
libxkbcommon = ">=1.13.2,<2"
wayland = ">=1.26.0,<2"
